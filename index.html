<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1688 Electronic Mart</title>
    <link rel="manifest" href="manifest.json">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="1688 Electronic Mart">
    <link rel="apple-touch-icon" href="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/a4/6a/06/a46a0662-72a3-2c1b-b184-7a1b8e1a1a6a/AppIcon-0-0-1x_U007emarketing-0-7-0-sRGB-85-220.png/512x512bb.jpg">
    <link rel="icon" type="image/png" href="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/a4/6a/06/a46a0662-72a3-2c1b-b184-7a1b8e1a1a6a/AppIcon-0-0-1x_U007emarketing-0-7-0-sRGB-85-220.png/192x192bb.png">
    <meta name="theme-color" content="#F26F20">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo" onclick="navigate('home')">
            <div class="official-logo-box">1688 Electronic Mart</div>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Search electronic components..." aria-label="Search">
        </div>
    </header>

    <main id="app-content">
        <!-- Content will be injected here -->
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" data-page="cart">
            <span class="nav-icon-wrapper">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" style="display: none;">0</span>
            </span>
            <span>Cart</span>
        </button>
        <button class="nav-item" data-page="message">
            <i class="fas fa-comment-dots"></i>
            <span>Message</span>
        </button>
        <button class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
